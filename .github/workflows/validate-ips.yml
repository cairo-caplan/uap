name: Validate UAP data JSON

on:
  push:
    paths:
      - 'ips/**'
      - 'projects/**'
      - 'cfg/schema*.json'
      - 'cfg/partners.json'
      - 'cfg/projects.json'
      - 'scripts/**'
      - 'cfg/catalog.json'
  pull_request:
    paths:
      - 'ips/**'
      - 'projects/**'
      - 'cfg/schema*.json'
      - 'cfg/partners.json'
      - 'cfg/projects.json'
      - 'scripts/**'
      - 'cfg/catalog.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install jsonschema
      - name: Validate ips/ and projects/ JSON files
        run: |
          python3 scripts/validate_ips.py --strict
      - name: Check catalogue aggregate is up to date
        run: |
          python3 scripts/build_catalog.py --check
